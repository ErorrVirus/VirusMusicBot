server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    remoteCipher:
      url: "http://virusmusicbot_yt_cipher:8001"
    oauth:
      enabled: ${YOUTUBE_OAUTH_ENABLED:false}
      skipInitialization: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    clients:
      - TV
      - TVHTML5_SIMPLY
      - WEB
      - ANDROID_VR
      - ANDROID_MUSIC
    clientOptions:
      TV:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      TVHTML5_SIMPLY:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      WEB:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      ANDROID_VR:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      ANDROID_MUSIC:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
  lavasrc:
    providers:
      - 'ytmsearch:"%ISRC%"'
      - 'ytmsearch:%QUERY%'
      - 'ytsearch:%QUERY%'
      - 'scsearch:%QUERY%'
    sources:
      spotify: ${LAVASRC_SPOTIFY_ENABLED:false}
      appleMusic: false
      deezer: false
      yandexMusic: false
      flowerytts: false
      youtube: false
    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      spDc: ${SPOTIFY_SPDC:}
      preferPartnerApi: true
      countryCode: US
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      repository: "https://maven.lavalink.dev/snapshots"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: ${LAVALINK_PASSWORD}
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: false   # Disabled: arbitrary HTTP streams bypass the bot's SSRF guard.
      local: false
    soundcloudFilterOutPreviewTracks: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 8
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: false
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: true
    nonAllocating: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    com.sedmelluq.discord.lavaplayer.tools.ExceptionTools: WARN
  request:
    enabled: false
    includeClientInfo: false
    includeHeaders: false
    includeQueryString: false
    includePayload: false
