services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: virusmusicpro-bot:3.0.0
    container_name: virusmusicbot_bot
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      lavalink:
        condition: service_healthy
    networks:
      - virusmusicbot_net
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:4000:4000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ${SSL_CERTS_HOST_DIR:-./certs}:/certs:ro
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID:-}
      - LAVALINK_HOST=virusmusicbot_lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_SPDC=${SPOTIFY_SPDC:-}
      - DB_PATH=/app/data/virusmusic.db
      - MAX_PLAYLIST_SIZE=${MAX_PLAYLIST_SIZE:-250}
      - VOICE_READY_TIMEOUT_MS=${VOICE_READY_TIMEOUT_MS:-10000}
      - ALLOW_HTTP_STREAMS=${ALLOW_HTTP_STREAMS:-false}
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-false}
      - DASHBOARD_PORT=4000
      - DASHBOARD_USER=${DASHBOARD_USER:-}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-}
      - DASHBOARD_PASS_HASH=${DASHBOARD_PASS_HASH:-}
      - DASHBOARD_JWT_SECRET=${DASHBOARD_JWT_SECRET:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - SSL_CRT_PATH=${SSL_CRT_PATH:-}
      - SSL_KEY_PATH=${SSL_KEY_PATH:-}
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  yt-cipher:
    image: ${YT_CIPHER_IMAGE:-ghcr.io/kikkia/yt-cipher:master}
    container_name: virusmusicbot_yt_cipher
    restart: unless-stopped
    networks:
      - virusmusicbot_net
    environment:
      - OVERRIDE_SCRIPT_VARIANT=IAS
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: virusmusicbot_lavalink
    restart: unless-stopped
    depends_on:
      - yt-cipher
    networks:
      - virusmusicbot_net
    volumes:
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./logs/lavalink:/opt/Lavalink/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --header=\"Authorization: $$LAVALINK_PASSWORD\" -qO /dev/null http://127.0.0.1:2333/v4/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    environment:
      - _JAVA_OPTIONS=-Xms512m -Xmx1G -XX:+UseG1GC -Djava.net.preferIPv4Stack=true
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD}
      - YOUTUBE_OAUTH_ENABLED=${YOUTUBE_OAUTH_ENABLED:-false}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      - LAVASRC_SPOTIFY_ENABLED=${LAVASRC_SPOTIFY_ENABLED:-false}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_SPDC=${SPOTIFY_SPDC:-}
    mem_limit: 1792m
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  virusmusicbot_net:
    name: virusmusicbot_net
    driver: bridge
